<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>redeuceの方向を変更</title>
</head>
<body>

	<script type="text/javascript">
		function toOneDimension(previousValue, currentValue) { 
			
			//以下デバッグ用　コンソールに途中経過表示
			console.log("previous:", previousValue);
			console.log("current :", currentValue);
			console.log("result  :", currentValue.concat(previousValue));
			console.log("-----");
					
			return previousValue.concat(currentValue);
		}
		var sampleArrayA = [
			['A1','A2','A3'],
			['B1','B2','B3'],
			['C1','C2','C3']
		];
		
		console.log("元配列:", sampleArrayA);
		
		/*var sampleArrayB = sampleArrayA.reduce(toOneDimension);から、
		reduceRightに変更して配列の末尾から処理するように変更*/
		var sampleArrayB = sampleArrayA.reduceRight(toOneDimension);
		
		console.log("結果配列:", sampleArrayB);

		for (var counterVar =0;counterVar<sampleArrayB.length;counterVar++) {
			document.write('sampleArrayB['+counterVar+']:');
			document.write(sampleArrayB[counterVar]);
			document.write('<br/>');
		}
		</script>
		
</body>
</html>
